name: Product feedback — unsigned signing-scope clarity
description: Help improve SignScope. DO NOT upload private keys, signatures, real sensitive wallet activity, or customer data.
title: "[Feedback] "
labels: ["feedback", "user-research"]
body:
  - type: markdown
    attributes:
      value: |
        SignScope is a local pre-sign explainer, not an audit or signer. We value real concrete feedback, including criticism. No private keys, signed messages, recovery phrases, or sensitive wallets.
  - type: dropdown
    id: situation
    attributes:
      label: What were you trying to understand?
      options:
        - EIP-2612 / ERC-20 permit
        - Permit2 allowance or signature transfer
        - ERC-20 approve transaction calldata
        - EIP-3009 USDC transfer authorization
        - AI agent wallet signing policy
        - Other
    validations:
      required: true
  - type: dropdown
    id: budget
    attributes:
      label: Would you pay for a useful, independently verifiable report?
      description: Nonbinding market research; no payment is requested or recorded.
      options:
        - "$0 — free tool is sufficient"
        - "$1 USDC per report"
        - "$5 USDC per report"
        - "$15 USDC for a defined engineering review"
        - "$50+ for developer integration"
        - "I would not use this"
    validations:
      required: true
  - type: textarea
    id: workflow
    attributes:
      label: What was missing or confusing?
      description: General information only. No signed wallet content or private account details.
      placeholder: "For example: I couldn't tell whether Permit2 included the recipient address."
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I did not include a wallet seed, signature, private key, confidential business data, or customer personal data.
          required: true
